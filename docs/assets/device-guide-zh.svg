<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7357ff"/>
      <stop offset="1" stop-color="#36b7d9"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#dfe1e7" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#23283b" flood-opacity=".08"/>
    </filter>
    <style>
      .zh { font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
      .title { font-size: 82px; font-weight: 800; letter-spacing: -2px; fill: #191c27; }
      .subtitle { font-size: 36px; font-weight: 600; fill: #5b6070; }
      .banner { font-size: 35px; font-weight: 700; fill: #fff; }
      .card-title { font-size: 42px; font-weight: 800; fill: #202331; }
      .body { font-size: 29px; font-weight: 500; fill: #5c6171; }
      .step { font-size: 27px; font-weight: 700; fill: #34394a; }
      .small { font-size: 24px; font-weight: 600; fill: #6a6f7d; }
      .repo { font-size: 24px; font-weight: 600; fill: #7a7f8d; }
    </style>
  </defs>

  <rect width="1600" height="2000" fill="#f7f6f2"/>
  <rect width="1600" height="2000" fill="url(#grid)" opacity=".42"/>
  <circle cx="1460" cy="155" r="210" fill="#e84b5c" opacity=".10"/>
  <circle cx="85" cy="1775" r="250" fill="#6957ff" opacity=".08"/>
  <path d="M120 180C330 50 520 60 675 130" fill="none" stroke="#e84b5c" stroke-width="14" stroke-linecap="round" opacity=".85"/>

  <g class="zh">
    <rect x="120" y="92" width="264" height="56" rx="28" fill="#e84b5c"/>
    <text x="252" y="130" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">开源・个人专属</text>

    <text x="120" y="264" class="title">网易云音乐 MCP｜每个人一套</text>
    <text x="120" y="330" class="subtitle">不是多人共用：独立部署・独立 Token・独立网易云会话</text>

    <rect x="120" y="382" width="1360" height="106" rx="28" fill="#202331"/>
    <circle cx="184" cy="435" r="28" fill="#e84b5c"/>
    <path d="M172 434l9 9 17-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="236" y="447" class="banner">你的 Cookie、Token、数据库，只属于你</text>
    <rect x="1190" y="409" width="230" height="52" rx="26" fill="url(#accent)"/>
    <text x="1305" y="444" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">ONE PERSON · ONE MCP</text>

    <!-- Mac -->
    <g filter="url(#shadow)">
      <rect x="120" y="540" width="655" height="430" rx="36" fill="#fff" stroke="#e2e3e9" stroke-width="2"/>
    </g>
    <rect x="160" y="580" width="88" height="88" rx="24" fill="#fde7ea"/>
    <rect x="177" y="600" width="54" height="36" rx="5" fill="none" stroke="#e84b5c" stroke-width="5"/>
    <path d="M168 646h72l-8 10h-56z" fill="#e84b5c"/>
    <text x="276" y="639" class="card-title">Mac</text>
    <line x1="160" y1="694" x2="735" y2="694" stroke="#ececf1" stroke-width="2"/>
    <circle cx="177" cy="751" r="6" fill="#e84b5c"/><text x="201" y="761" class="body">下载：Docker Desktop</text>
    <circle cx="177" cy="816" r="6" fill="#e84b5c"/><text x="201" y="826" class="body">或 Node.js 20+、网易云音乐</text>
    <circle cx="177" cy="881" r="6" fill="#e84b5c"/><text x="201" y="891" class="body">本地控制 + 远程 MCP</text>
    <rect x="160" y="914" width="255" height="34" rx="17" fill="#fceff1"/>
    <text x="287" y="939" text-anchor="middle" font-size="20" font-weight="700" fill="#c93648">播放控制最完整</text>

    <!-- Windows -->
    <g filter="url(#shadow)">
      <rect x="825" y="540" width="655" height="430" rx="36" fill="#fff" stroke="#e2e3e9" stroke-width="2"/>
    </g>
    <rect x="865" y="580" width="88" height="88" rx="24" fill="#e9efff"/>
    <path d="M884 600l23-4v27h-23zm27-5l25-4v32h-25zm-27 32h23v27l-23-4zm27 0h25v32l-25-4z" fill="#4774d9"/>
    <text x="981" y="639" class="card-title">Windows</text>
    <line x1="865" y1="694" x2="1440" y2="694" stroke="#ececf1" stroke-width="2"/>
    <circle cx="882" cy="751" r="6" fill="#4774d9"/><text x="906" y="761" class="body">下载：Docker Desktop</text>
    <circle cx="882" cy="816" r="6" fill="#4774d9"/><text x="906" y="826" class="body">或 Node.js 20+</text>
    <circle cx="882" cy="881" r="6" fill="#4774d9"/><text x="906" y="891" class="body">搜索、歌词、歌单可用</text>
    <rect x="865" y="914" width="245" height="34" rx="17" fill="#edf2ff"/>
    <text x="987" y="939" text-anchor="middle" font-size="20" font-weight="700" fill="#315fb9">播放控制适配中</text>

    <!-- VPS -->
    <g filter="url(#shadow)">
      <rect x="120" y="1020" width="655" height="430" rx="36" fill="#fff" stroke="#e2e3e9" stroke-width="2"/>
    </g>
    <rect x="160" y="1060" width="88" height="88" rx="24" fill="#ece9ff"/>
    <rect x="177" y="1078" width="54" height="20" rx="5" fill="none" stroke="#6957d9" stroke-width="5"/>
    <rect x="177" y="1108" width="54" height="20" rx="5" fill="none" stroke="#6957d9" stroke-width="5"/>
    <circle cx="218" cy="1088" r="3" fill="#6957d9"/><circle cx="218" cy="1118" r="3" fill="#6957d9"/>
    <text x="276" y="1119" class="card-title">VPS / NAS / Linux</text>
    <line x1="160" y1="1174" x2="735" y2="1174" stroke="#ececf1" stroke-width="2"/>
    <circle cx="177" cy="1231" r="6" fill="#6957d9"/><text x="201" y="1241" class="body">安装：Docker + HTTPS 域名</text>
    <circle cx="177" cy="1296" r="6" fill="#6957d9"/><text x="201" y="1306" class="body">适合 24 小时在线</text>
    <circle cx="177" cy="1361" r="6" fill="#6957d9"/><text x="201" y="1371" class="body">每人部署自己的实例</text>
    <rect x="160" y="1394" width="278" height="34" rx="17" fill="#f0edff"/>
    <text x="299" y="1419" text-anchor="middle" font-size="20" font-weight="700" fill="#5644bf">手机连接最省心</text>

    <!-- Phone and AI -->
    <g filter="url(#shadow)">
      <rect x="825" y="1020" width="655" height="430" rx="36" fill="#fff" stroke="#e2e3e9" stroke-width="2"/>
    </g>
    <rect x="865" y="1060" width="88" height="88" rx="24" fill="#e5f7f9"/>
    <rect x="890" y="1074" width="38" height="61" rx="8" fill="none" stroke="#299cb2" stroke-width="5"/>
    <circle cx="909" cy="1126" r="3" fill="#299cb2"/>
    <text x="981" y="1105" class="card-title" font-size="34">手机 / ChatGPT /</text>
    <text x="981" y="1147" class="card-title" font-size="34">DeepSeek / 自建前端</text>
    <line x1="865" y1="1174" x2="1440" y2="1174" stroke="#ececf1" stroke-width="2"/>
    <circle cx="882" cy="1231" r="6" fill="#299cb2"/><text x="906" y="1241" class="body">手机无需安装 Node.js</text>
    <circle cx="882" cy="1296" r="6" fill="#299cb2"/><text x="906" y="1306" class="body">支持 MCP：添加 /mcp</text>
    <circle cx="882" cy="1361" r="6" fill="#299cb2"/><text x="906" y="1371" class="body">其他平台：OpenAPI + 个人 Token</text>

    <!-- Steps -->
    <rect x="120" y="1504" width="1360" height="178" rx="36" fill="#fff" stroke="#e2e3e9" stroke-width="2"/>
    <text x="160" y="1553" font-size="25" font-weight="800" fill="#e84b5c">4 步接入</text>
    <path d="M250 1613H1370" stroke="#d9dbe3" stroke-width="5" stroke-linecap="round"/>
    <g>
      <circle cx="260" cy="1613" r="30" fill="#e84b5c"/><text x="260" y="1623" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">1</text>
      <circle cx="620" cy="1613" r="30" fill="#6957d9"/><text x="620" y="1623" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">2</text>
      <circle cx="980" cy="1613" r="30" fill="#4774d9"/><text x="980" y="1623" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">3</text>
      <circle cx="1340" cy="1613" r="30" fill="#299cb2"/><text x="1340" y="1623" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">4</text>
      <text x="260" y="1661" text-anchor="middle" class="step">部署自己的实例</text>
      <text x="620" y="1661" text-anchor="middle" class="step">打开 /setup</text>
      <text x="980" y="1661" text-anchor="middle" class="step">生成自己的 Token</text>
      <text x="1340" y="1661" text-anchor="middle" class="step">连接 AI</text>
    </g>

    <rect x="120" y="1736" width="1360" height="76" rx="24" fill="#fdebed"/>
    <text x="800" y="1785" text-anchor="middle" class="small" fill="#b92e40">不共享账号密码｜歌单写入必须确认｜不提供音频下载</text>

    <text x="120" y="1890" class="repo">github.com/tianyupaipai-cmd/netease-music-mcp</text>
    <text x="1480" y="1890" text-anchor="end" font-size="30" font-weight="800" fill="#202331">@派派日记</text>
    <text x="120" y="1935" font-size="20" font-weight="500" fill="#9a9eaa">非网易云音乐官方项目 · 开源自托管 · v0.6</text>
  </g>
</svg>
